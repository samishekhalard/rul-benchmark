# Параметры протокола. Одинаковы для всех моделей — в этом смысл бенчмарка.
window: 30          # длина окна в циклах
rul_cap: 125        # ограничение RUL сверху
val_fraction: 0.2   # доля юнитов в валидации (делим по юнитам, не по окнам)
batch_size: 256
epochs: 100
patience: 15        # ранняя остановка
lr: 0.001
seeds: [42, 1337, 2024]
