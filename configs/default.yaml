data:
  subset: FD001          # FD001 | FD002 | FD003 | FD004
  window: 30             # sliding window length (cycles)
  rul_cap: 125           # piecewise-linear RUL cap (see Protocol §1)
  val_fraction: 0.2      # fraction of training *units* held out for validation

training:
  epochs: 100
  patience: 15           # early stopping patience (val RMSE)
  lr: 0.001
  batch_size: 256
  grad_clip: 1.0         # gradient clipping max norm
  seeds: [42, 1337, 2024]

model:
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
